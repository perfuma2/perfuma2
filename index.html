<!-- ================= PARCHE MAESTRO DE AJUSTES VISUALES Y FUNCIONALES ================= -->
<style>
  /* 1. Corrige todos los cuadros que se salen del margen derecho (Combos, Decants, IA, Ventas) */
  *, *::before, *::after {
    box-sizing: border-box !important;
  }
  .card-panel, .form-grid, .form-group, .modal-box {
    box-sizing: border-box !important;
    max-width: 100% !important;
  }
  .user-input, input.user-input, select.user-input, textarea.user-input {
    box-sizing: border-box !important;
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
  }

  /* 2. Oculta el subtítulo v.95 oyamh95 debajo de PERFUMA2 y deja solo el botón de campana */
  .brand-subtitle {
    display: none !important;
  }

  /* 3. Ajusta recuadros de tasas BCV y USDT para que se vean todos los números completos */
  #box-tasa-bcv, #box-tasa-usdt {
    flex: 1 1 0 !important;
    min-width: 112px !important;
    padding: 6px 10px !important;
  }
  #tasaBCVInput, #tasaUSDTInput {
    width: 100% !important;
    min-width: 85px !important;
    font-size: 14px !important;
    padding: 0 !important;
  }
  #btn-sync-manual {
    font-size: 9.5px !important;
    padding: 4px 9px !important;
    border-radius: 20px !important;
    height: auto !important;
    white-space: nowrap !important;
  }

  /* 4. Inventario & Stock: líneas conectadas sin desfase y tabla integrada a la pantalla */
  #tab-inventario .table-responsive {
    width: 100% !important;
    overflow-x: auto !important;
  }
  #tab-inventario table {
    width: 100% !important;
    border-collapse: collapse !important;
  }
  #tab-inventario table th,
  #tab-inventario table td {
    display: table-cell !important;
    vertical-align: middle !important;
    border-bottom: 1.5px solid var(--border-color) !important;
    padding: 8px 6px !important;
    font-size: 11px !important;
    line-height: 1.25 !important;
  }
  [data-theme="light"] #tab-inventario table td {
    border-bottom: 1.5px solid #cbd5e1 !important;
  }
  #tab-inventario #buscar-inv {
    padding: 6px 10px !important;
    font-size: 11.5px !important;
    height: 32px !important;
  }

  /* 5. Ventas Detal y Mayor: achicar el cuadro de cantidad (1 / 6) y agrandar buscador de perfume */
  #v-cantidad-item, #m-cantidad-item {
    width: 44px !important;
    min-width: 44px !important;
    max-width: 44px !important;
    padding: 8px 2px !important;
    text-align: center !important;
    font-size: 13px !important;
  }
  #v-producto-input, #m-producto-input {
    width: 100% !important;
    min-width: 0 !important;
    font-size: 12px !important;
    padding: 8px 10px !important;
  }

  /* 6. Catálogo Público: logo más grande, quitar título PERFUMA2, botón con colores del logo y total visible */
  #app-catalogo .cat-title-text {
    display: none !important;
  }
  #app-catalogo .cat-hero .logo-3d-circle {
    width: 105px !important;
    height: 105px !important;
    margin-bottom: 6px !important;
  }
  #app-catalogo .cat-item-btn {
    background: linear-gradient(135deg, #0d9488, #0f766e) !important;
    color: #ffffff !important;
    border: 1.5px solid #5eead4 !important;
    box-shadow: 0 4px 12px rgba(13, 148, 136, 0.3) !important;
    font-weight: 900 !important;
    letter-spacing: 0.5px !important;
  }
  #app-catalogo .cat-item-btn.added {
    background: linear-gradient(135deg, #059669, #10b981) !important;
    color: #ffffff !important;
  }
  [data-theme="light"] #cat-cart-total-txt,
  [data-theme="light"] .cat-cart-total {
    color: #0f766e !important;
    text-shadow: none !important;
    font-weight: 900 !important;
    font-size: 20px !important;
  }
</style>

<script>
(function aplicarAjustesPerfuma2() {
  function ejecutarParchesDOM() {
    // A. Subir el botón GUARDAR al lado del reloj en la primera fila
    const btnGuardar = document.getElementById('btn-sync-manual');
    const reloj = document.getElementById('reloj-sistema');
    if (btnGuardar && reloj && reloj.parentElement && btnGuardar.parentElement !== reloj.parentElement) {
      reloj.parentElement.appendChild(btnGuardar);
    }

    // B. Compactar controles de Inventario & Stock (Margen arriba y 4 botones en 1 sola fila)
    const ordenStock = document.getElementById('orden-stock');
    const inputMargen = document.getElementById('input-margen-global');
    if (ordenStock && inputMargen) {
      const boxMargen = inputMargen.parentElement;
      const filaSuperior = ordenStock.parentElement;
      if (boxMargen && filaSuperior) {
        filaSuperior.style.cssText = 'display:flex !important; align-items:center !important; justify-content:space-between !important; gap:6px !important; width:100% !important; flex-wrap:nowrap !important;';
        ordenStock.style.cssText = 'width:auto !important; flex:1 !important; padding:5px 8px !important; font-size:11px !important; height:30px !important;';
        boxMargen.style.cssText = 'display:flex !important; align-items:center !important; gap:4px !important; padding:3px 6px !important; border-radius:8px !important; background:var(--bg-input) !important; border:1px solid var(--border-color) !important; flex-shrink:0 !important;';
        inputMargen.style.cssText = 'width:38px !important; padding:2px 4px !important; font-size:11px !important; height:22px !important; text-align:center !important;';
      }
    }

    // Poner UNIFICAR, STOCK 0, EXCEL y + NUEVO pequeños en una sola fila
    const buscarInv = document.getElementById('buscar-inv');
    if (buscarInv && buscarInv.parentElement && buscarInv.parentElement.parentElement) {
      const contenedorBusquedaBotones = buscarInv.parentElement.parentElement;
      contenedorBusquedaBotones.style.cssText = 'display:flex !important; flex-direction:column !important; gap:6px !important; margin-bottom:10px !important;';
      buscarInv.parentElement.style.cssText = 'width:100% !important;';
      const cajaBotones = buscarInv.parentElement.nextElementSibling;
      if (cajaBotones) {
        cajaBotones.style.cssText = 'display:grid !important; grid-template-columns:repeat(4, 1fr) !important; gap:5px !important; width:100% !important;';
        cajaBotones.querySelectorAll('button').forEach(b => {
          b.style.cssText += '; font-size:9.5px !important; padding:6px 4px !important; white-space:nowrap !important; width:100% !important;';
        });
      }
    }

    // C. Ajustar la grilla de buscador + cantidad + añadir en Ventas Detal y Mayor
    ['v-cantidad-item', 'm-cantidad-item'].forEach(idCant => {
      const elCant = document.getElementById(idCant);
      if (elCant && elCant.parentElement && elCant.parentElement.parentElement) {
        const gridRow = elCant.parentElement.parentElement;
        gridRow.style.cssText = 'display:grid !important; grid-template-columns:minmax(0, 1fr) 46px auto !important; gap:6px !important; align-items:center !important; width:100% !important;';
        elCant.parentElement.style.cssText = 'width:46px !important;';
      }
    });

    // D. Ajustar tarjeta 3D en Asistente IA para que no se salga del cuadro
    const tabIA = document.getElementById('tab-ia');
    if (tabIA) {
      tabIA.querySelectorAll('.card-panel, div').forEach(div => {
        if (div.style && (div.style.maxWidth || div.style.width)) {
          div.style.maxWidth = '100%';
          div.style.boxSizing = 'border-box';
        }
      });
    }
  }

  // E. Decorar botones "AÑADIR" en el catálogo público con el perfumito 🧴
  function estilizarBotonesCatalogo() {
    document.querySelectorAll('#cat-grid-productos .cat-item-btn').forEach(btn => {
      if (!btn.classList.contains('added') && !btn.innerHTML.includes('🧴')) {
        btn.innerHTML = '🧴 AÑADIR';
      }
    });
  }

  // F. Arreglar nombres de perfumes (evitar "1x 2") y agregar botón de eliminar (🗑️) en el carrito público
  function obtenerNombreRealPerfume(item) {
    if (!item) return 'Perfume';
    const nom = String(item.nombre || '').trim();
    const mar = String(item.marca || '').trim();
    if (/^\d+$/.test(nom) && mar.length > 1) return mar;
    if (mar && nom && !mar.toLowerCase().includes(nom.toLowerCase())) return mar + ' ' + nom;
    return mar || nom || 'Perfume';
  }

  window.eliminarDelCarritoPublico = function(idx) {
    if (typeof carritoPublico !== 'undefined' && Array.isArray(carritoPublico)) {
      carritoPublico.splice(idx, 1);
      if (typeof actualizarBarraCarritoPublico === 'function') actualizarBarraCarritoPublico();
      if (typeof abrirModalCarritoPublico === 'function') abrirModalCarritoPublico();
      // Recalcular totales visibles por seguridad
      const tasa = typeof obtenerTasaActiva === 'function' ? obtenerTasaActiva() : 1;
      const totalUSD = carritoPublico.reduce((acc, el) => acc + (parseFloat(el.precio) || 0) * (parseInt(el.cantidad) || 1), 0);
      const count = carritoPublico.reduce((acc, el) => acc + (parseInt(el.cantidad) || 1), 0);
      const txtTot = document.getElementById('cat-cart-total-txt');
      const txtBtn = document.getElementById('cat-cart-btn-txt');
      const chkTot = document.getElementById('cat-checkout-total');
      const chkBs = document.getElementById('cat-checkout-bs');
      if (txtTot) txtTot.textContent = '$' + totalUSD.toFixed(2);
      if (txtBtn) txtBtn.textContent = 'Ver Carrito (' + count + ')';
      if (chkTot) chkTot.textContent = '$' + totalUSD.toFixed(2);
      if (chkBs) chkBs.textContent = 'Bs. ' + (totalUSD * tasa).toFixed(2);
    }
  };

  const origAbrirModalCarrito = window.abrirModalCarritoPublico;
  if (typeof origAbrirModalCarrito === 'function') {
    window.abrirModalCarritoPublico = function() {
      if (typeof carritoPublico !== 'undefined' && Array.isArray(carritoPublico)) {
        carritoPublico.forEach(item => {
          item.nombre = obtenerNombreRealPerfume(item);
        });
      }
      origAbrirModalCarrito.apply(this, arguments);
      const cont = document.getElementById('cat-carrito-items');
      if (cont && typeof carritoPublico !== 'undefined' && Array.isArray(carritoPublico)) {
        if (carritoPublico.length === 0) {
          cont.innerHTML = '<div style="text-align:center; padding:16px; color:var(--text-muted);">Tu carrito está vacío.</div>';
        } else {
          cont.innerHTML = carritoPublico.map((item, idx) => {
            const cant = parseInt(item.cantidad) || 1;
            const subtotal = ((parseFloat(item.precio) || 0) * cant).toFixed(2);
            const nombreLimpio = obtenerNombreRealPerfume(item);
            return `<div class="pub-cart-item" style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border-color);">
              <div style="font-weight:800; font-size:12.5px; flex:1;">${cant}x ${nombreLimpio} <span style="color:var(--accent);">($${subtotal})</span></div>
              <button type="button" onclick="eliminarDelCarritoPublico(${idx})" style="background:rgba(220,38,38,0.12); color:#dc2626; border:1px solid rgba(220,38,38,0.3); padding:5px 9px; border-radius:8px; font-size:12px; font-weight:900; box-shadow:none;">🗑️</button>
            </div>`;
          }).join('');
        }
      }
    };
  }

  // G. Formato de 3 líneas para Pago Móvil en Asistente IA (Cédula / Código Banco / Teléfono)
  function obtenerPagoMovilTresLineas() {
    let bancoTxt = '', cedulaTxt = '', telTxt = '';
    const inputs = document.querySelectorAll('#tab-ia input');
    inputs.forEach(inp => {
      const val = (inp.value || '').trim();
      const prev = inp.previousElementSibling ? inp.previousElementSibling.textContent.toUpperCase() : '';
      if (prev.includes('BANCO') && prev.includes('MÓVIL')) bancoTxt = val;
      if (prev.includes('CÉDULA') || prev.includes('RIF')) cedulaTxt = val;
      if (prev.includes('TELÉFONO') && prev.includes('MÓVIL')) telTxt = val;
    });
    if (!cedulaTxt || !telTxt) {
      const textoIA = document.getElementById('tab-ia') ? document.getElementById('tab-ia').innerText : '';
      const mBanco = textoIA.match(/Banco:\s*([^\n]+)/i);
      const mCed = textoIA.match(/C[ée]dula\/RIF:\s*([^\n]+)/i);
      const mTel = textoIA.match(/Tel[ée]fono:\s*([0-9\-]+)/i);
      if (mBanco && !bancoTxt) bancoTxt = mBanco[1];
      if (mCed && !cedulaTxt) cedulaTxt = mCed[1];
      if (mTel && !telTxt) telTxt = mTel[1];
    }
    const cedulaLimpia = (cedulaTxt.replace(/\D/g, '')) || '24162167';
    const matchCodigo = bancoTxt.match(/\d{4}/);
    const codigoBanco = matchCodigo ? matchCodigo[0] : '0102';
    const telefonoLimpio = (telTxt.replace(/\D/g, '')) || '04120551688';
    return `${cedulaLimpia}\n${codigoBanco}\n${telefonoLimpio}`;
  }

  document.addEventListener('click', function(e) {
    const btn = e.target.closest('button');
    if (!btn) return;
    const txt = (btn.innerText || '').toUpperCase();
    if (txt.includes('COPIAR SOLO LA CUENTA')) {
      e.preventDefault();
      e.stopPropagation();
      const bloque3Lineas = obtenerPagoMovilTresLineas();
      navigator.clipboard.writeText(bloque3Lineas).then(() => {
        alert('✅ Datos de Pago Móvil copiados en 3 líneas:\n\n' + bloque3Lineas);
      });
    } else if (txt.includes('ENVIAR IMAGEN Y TEXTO') || txt.includes('ENVIAR DETALLE + CUENTA APARTE')) {
      const bloque3Lineas = obtenerPagoMovilTresLineas();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(bloque3Lineas).catch(() => {});
      }
    }
  }, true);

  const origRenderCat = window.renderCatalogoPublico;
  if (typeof origRenderCat === 'function') {
    window.renderCatalogoPublico = function() {
      origRenderCat.apply(this, arguments);
      estilizarBotonesCatalogo();
    };
  }

  window.addEventListener('load', function() {
    ejecutarParchesDOM();
    setTimeout(ejecutarParchesDOM, 800);
    setTimeout(estilizarBotonesCatalogo, 900);
  });
  ejecutarParchesDOM();
})();
</script>
<!-- ================= FIN DEL PARCHE MAESTRO ================= -->
