<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PERFUMA2 - Gestión de Perfumería</title>

<!-- Configuración de Íconos y PWA -->
<link rel="icon" type="image/jpeg" href="logo.jpg.jpg">
<link rel="apple-touch-icon" href="logo.jpg.jpg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#070b14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PERFUMA2">

<!-- Librerías Externas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  :root { 
    --bg-main: #070b14; 
    --bg-card: #111a2e; 
    --bg-input: #1a2642; 
    --border-color: #223254; 
    --accent: #00f2d6; 
    --accent-hover: #00c7b0; 
    --text-main: #f8fafc; 
    --text-muted: #94a3b8; 
    --danger: #ff4d6d; 
    --warning: #ffb703; 
    --success: #06d6a0; 
    --info: #3a86ff; 
    --purple: #9d4edd; 
    --card-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }

  [data-theme="light"] {
    --bg-main: #f8fafc; --bg-card: #ffffff; --bg-input: #f1f5f9; 
    --border-color: #cbd5e1; --accent: #0f766e; --accent-hover: #115e59; 
    --text-main: #0f172a; --text-muted: #64748b; --danger: #dc2626; 
    --warning: #d97706; --success: #059669; --info: #0284c7; --purple: #7c3aed; 
  }

  body { margin: 0; padding: 16px; background: var(--bg-main); color: var(--text-main); font-size: 13px; font-family: sans-serif; }
  .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding-bottom: 14px; border-bottom: 2px solid var(--border-color); margin-bottom: 18px; }
  .brand-title { font-size: 26px; font-weight: 900; color: var(--accent); margin: 0; letter-spacing: 1.5px; }
  
  button { cursor: pointer; border: none; border-radius: 10px; padding: 10px 16px; font-weight: 800; font-size: 12px; text-transform: uppercase; }
  .btn-primary { background: var(--accent); color: #070b14; }
  
  .nav-tabs { display: flex; gap: 8px; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 8px; margin-bottom: 18px; }
  .tab-btn { background: var(--bg-card); color: var(--text-muted); border: 2px solid var(--border-color); padding: 10px 16px; border-radius: 12px; font-weight: 800; white-space: nowrap; flex-shrink: 0; }
  .tab-btn.active { background: rgba(0,242,214,0.15); color: var(--accent); border-color: var(--accent); }
  .tab-content { display: none; } .tab-content.active { display: block; }

  .card-panel { background: var(--bg-card); border: 2px solid var(--border-color); border-radius: 14px; padding: 20px; margin-bottom: 20px; box-shadow: var(--card-shadow); }
  .user-input { width: 100%; background: var(--bg-input); border: 1.5px solid var(--border-color); color: var(--text-main); padding: 10px 14px; border-radius: 10px; font-size: 13px; outline: none; }
</style>
</head>
<body>

<div id="app-admin">
  <div class="header-bar">
    <div>
      <h1 class="brand-title">PERFUMA2</h1>
      <span style="font-size: 10px; color: var(--accent);">v.95 - Oyam Hernandez</span>
    </div>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="cambiarTab('dashboard', this)">📊 Dashboard</button>
    <button class="tab-btn" onclick="cambiarTab('inventario', this)">🧴 Catálogo & Stock</button>
    <button class="tab-btn" onclick="cambiarTab('ventas', this)">💳 Ventas Detal</button>
    <button class="tab-btn" onclick="cambiarTab('decants', this)">🧪 Decants</button>
  </div>

  <div id="tab-dashboard" class="tab-content active">
    <div class="card-panel">
      <h3>Panel de Control Principal</h3>
      <p>Sincronización en la nube con Firebase activa.</p>
    </div>
  </div>

  <div id="tab-inventario" class="tab-content">
    <div class="card-panel">
      <h3>Inventario de Perfumes</h3>
    </div>
  </div>

  <div id="tab-ventas" class="tab-content">
    <div class="card-panel">
      <h3>Ventas al Detal</h3>
      <label style="display:flex; align-items:center; gap:8px; margin-top:10px; cursor:pointer;">
        <input type="checkbox" id="v-usa-delivery" onchange="toggleDeliveryPanel('detal')"> 🛵 Enviar con Motorizado
      </label>
      <div id="v-delivery-panel" style="display:none; margin-top:10px;">
        <input type="text" class="user-input" placeholder="Nombre del Motorizado">
      </div>
    </div>
  </div>

  <div id="tab-decants" class="tab-content">
    <div class="card-panel">
      <h3>Muestras y Decants</h3>
      <label style="display:flex; align-items:center; gap:8px; margin-top:10px; cursor:pointer;">
        <input type="checkbox" id="dec-usa-delivery" onchange="toggleDeliveryPanel('decant')"> 🛵 Enviar con Motorizado
      </label>
      <div id="dec-delivery-panel" style="display:none; margin-top:10px;">
        <input type="text" class="user-input" placeholder="Nombre del Motorizado">
      </div>
    </div>
  </div>
</div>

<script>
function cambiarTab(id, b) {
    document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
    document.getElementById('tab-' + id).classList.add('active');
    if(b) b.classList.add('active');
}
function toggleDeliveryPanel(tipo) {
    let idChk = tipo === 'detal' ? 'v-usa-delivery' : 'dec-usa-delivery';
    let idPanel = tipo === 'detal' ? 'v-delivery-panel' : 'dec-delivery-panel';
    const chk = document.getElementById(idChk), panel = document.getElementById(idPanel);
    if (chk && panel) panel.style.display = chk.checked ? 'block' : 'none';
}
</script>
</body>
</html>
