<style>
  *, *::before, *::after { box-sizing: border-box !important; }
  :root { 
    --bg-main: #070b14; --bg-card: #111a2e; --bg-input: #1a2642; 
    --border-color: #223254; --accent: #00f2d6; --accent-hover: #00c7b0; 
    --text-main: #f8fafc; --text-muted: #94a3b8; --danger: #ff4d6d; 
    --warning: #ffb703; --success: #06d6a0; --info: #3a86ff; 
    --purple: #9d4edd; --card-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  [data-theme="light"] {
    --bg-main: #f8fafc; --bg-card: #ffffff; --bg-input: #f1f5f9; 
    --border-color: #cbd5e1; --accent: #0f766e; --accent-hover: #115e59; 
    --text-main: #0f172a; --text-muted: #64748b; --danger: #dc2626; 
    --warning: #d97706; --success: #059669; --info: #0284c7; 
    --purple: #7c3aed; --card-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  [data-theme="light"] .user-input { background: #f8fafc !important; border-color: #cbd5e1 !important; color: #0f172a !important; }
  [data-theme="light"] .card-panel, [data-theme="light"] .kpi-card { background: #ffffff !important; border-color: #e2e8f0 !important; }
  [data-theme="light"] td { border-bottom: 1.5px solid #cbd5e1 !important; color: #0f172a !important; }
  [data-theme="light"] th { background: #e6f7f7 !important; color: #0f766e !important; border-bottom: 2px solid #99f6e4 !important; }
  [data-theme="light"] .tasa-input { color: #0f172a !important; font-weight: 900 !important; }
  [data-theme="light"] .caja-totales { background: #f0fdfa !important; border-color: #99f6e4 !important; }
  body { margin: 0; padding: 10px; background: var(--bg-main); color: var(--text-main); font-size: 13px; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }

  #loader-pantalla { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #111a2e 0%, #070b14 100%); z-index: 9999999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s ease; }
  .loader-text-glow { color: #00f2d6; margin-top: 20px; font-weight: 900; letter-spacing: 3px; font-size: 24px; }
  .loader-spinner { margin-top: 15px; width: 44px; height: 44px; border: 4px solid #223254; border-top: 4px solid #00f2d6; border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  
  .logo-3d-wrapper { position: relative; display: inline-flex; align-items: center; justify-content: center; }
  .logo-3d-circle { position: relative; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #1a294d, #070b14 85%); border: 2.5px solid var(--accent); box-shadow: 0 6px 18px rgba(0,0,0,0.4), 0 0 15px rgba(0,242,214,0.3); overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .logo-3d-circle img { width: 100%; height: 100%; object-fit: cover; }
  
  .header-bar { display: flex; flex-direction: column; gap: 8px; padding-bottom: 10px; border-bottom: 2px solid var(--border-color); margin-bottom: 12px; }
  .brand-title { font-size: 22px; font-weight: 900; color: var(--accent); margin: 0; letter-spacing: 1px; }
  #version-badge-flotante { background: rgba(0, 242, 214, 0.1); border: 1.5px solid var(--accent); color: var(--accent); padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 900; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  [data-theme="light"] #version-badge-flotante { background: #ffffff !important; border-color: #0f766e !important; color: #0f766e !important; }
  
  .tasa-box { background: var(--bg-card); border: 2px solid var(--border-color); padding: 6px 10px; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; cursor: pointer; flex: 1 1 0; min-width: 112px; }
  .tasa-box.activa { border-color: var(--accent); background: rgba(0,242,214,0.1); box-shadow: 0 0 12px rgba(0,242,214,0.2); }
  .tasa-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; font-weight: 900; display: block; margin-bottom: 2px; }
  .tasa-input { background: transparent; border: none; color: var(--text-main); font-weight: 900; font-size: 15px; width: 100%; min-width: 85px; outline: none; padding: 0; }
  
  button { cursor: pointer; border: none; border-radius: 10px; padding: 9px 14px; font-weight: 800; font-size: 11.5px; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 5px; text-transform: uppercase; }
  button:active { transform: scale(0.96); }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-hover)); color: #ffffff; }
  :root:not([data-theme="light"]) .btn-primary { color: #070b14; }
  .btn-secondary { background: var(--bg-input); color: var(--text-main); border: 1.5px solid var(--border-color); }
  .btn-warning { background: linear-gradient(135deg, var(--warning), #e89b00); color: #070b14; }
  .btn-danger { background: rgba(255,77,109,0.15); color: var(--danger); border: 1px solid rgba(255,77,109,0.35); }
  .btn-purple { background: linear-gradient(135deg, var(--purple), #7b2cbf); color: #fff; }
  
  .nav-tabs { display: flex; gap: 8px; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 6px; margin-bottom: 14px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .nav-tabs::-webkit-scrollbar { display: none; }
  .tab-btn { position: relative; background: var(--bg-card); color: var(--text-muted); border: 2px solid var(--border-color); padding: 9px 14px; border-radius: 12px; font-weight: 800; font-size: 11.5px; white-space: nowrap; flex-shrink: 0; }
  .tab-btn.active { background: rgba(15,118,110,0.12); color: var(--accent); border-color: var(--accent); }
  .tab-content { display: none; } .tab-content.active { display: block; }
  .badge-alerta { position: absolute; top: -6px; right: -6px; background: var(--danger); color: #fff; font-size: 9px; font-weight: 900; padding: 2px 6px; border-radius: 50px; display: none; }
  
  .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  .kpi-card { background: var(--bg-card); border: 1.5px solid var(--border-color); border-radius: 14px; padding: 14px; }
  .kpi-title { font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 900; margin-bottom: 6px; }
